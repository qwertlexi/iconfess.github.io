<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>忏悔室 · Confessional</title>
<meta name="description" content="一间没有名字、没有记录的忏悔室。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Crimson+Pro:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 常驻烛火：贯穿全程的信物 -->
  <div class="candle" id="candle" aria-hidden="true">
    <div class="candle-glow"></div>
    <svg class="candle-flame" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="wobble" x="-60%" y="-60%" width="220%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.08" numOctaves="2" seed="7" result="noise">
            <animate attributeName="baseFrequency" dur="6s" values="0.018 0.08;0.03 0.12;0.018 0.08" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
        </filter>
        <radialGradient id="flameOuter" cx="46%" cy="72%" r="75%">
          <stop offset="0%" stop-color="#ffdca0"/>
          <stop offset="32%" stop-color="#e8823f"/>
          <stop offset="70%" stop-color="#a4441a"/>
          <stop offset="100%" stop-color="#3d1608"/>
        </radialGradient>
        <radialGradient id="flameMid" cx="48%" cy="70%" r="72%">
          <stop offset="0%" stop-color="#fff2cf"/>
          <stop offset="45%" stop-color="#f2a34f"/>
          <stop offset="100%" stop-color="#b85a1f"/>
        </radialGradient>
        <radialGradient id="flameCore" cx="50%" cy="68%" r="65%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#ffe6b0"/>
          <stop offset="100%" stop-color="#f2a34f"/>
        </radialGradient>
        <radialGradient id="flameBase" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#8fd0ff"/>
          <stop offset="60%" stop-color="#2f6fae"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <g filter="url(#wobble)">
        <path class="flame-outer" d="M20 3 C 9 18, 4 33, 11 48 C 6 56, 9 64, 20 68 C 31 64, 34 56, 29 48 C 36 33, 31 18, 20 3 Z" fill="url(#flameOuter)" opacity="0.92"/>
        <path class="flame-mid" d="M19 12 C 11 24, 8 36, 14 50 C 10 56, 13 61, 19 64 C 27 61, 29 55, 25 49 C 31 36, 27 24, 19 12 Z" fill="url(#flameMid)" opacity="0.95"/>
        <path class="flame-core" d="M21 26 C 16 34, 15 43, 19 52 C 16 56, 18 60, 21 61 C 25 60, 27 55, 24 51 C 28 43, 26 34, 21 26 Z" fill="url(#flameCore)"/>
        <ellipse cx="20" cy="59" rx="5" ry="6.5" fill="url(#flameBase)" opacity="0.5"/>
      </g>
      <circle class="spark" cx="25" cy="8" r="1.3" fill="#ffdca0"/>
    </svg>
    <div class="candle-body"></div>
  </div>

  <!-- 屏 1：开机 -->
  <section class="screen" id="screen-boot">
    <p class="boot-hint" id="boot-hint">点一盏烛，进入</p>
  </section>

  <!-- 屏 2：引导 -->
  <section class="screen" id="screen-guide">
    <div class="guide-lines" id="guide-lines">
      <p class="line">这里没有名字，没有记录。</p>
      <p class="line">你说出的话，只有烛火听见。</p>
      <p class="line">说完之后，它会替你带走。</p>
    </div>
    <button class="btn" id="btn-enter">进入</button>
  </section>

  <!-- 屏 3：忏悔 -->
  <section class="screen" id="screen-confess">
    <div class="grille" aria-hidden="true"></div>
    <div class="confess-wrap">
      <p class="prompt">说出你想说的。</p>
      <textarea id="confess-input" class="confess-input" placeholder="……" rows="6" maxlength="600"></textarea>
      <div class="confess-foot">
        <span class="count" id="char-count">0 / 600</span>
        <button class="btn small" id="btn-submit" disabled>说出口</button>
      </div>
    </div>
  </section>

  <!-- 屏 4：焚去（过渡） -->
  <section class="screen" id="screen-burning">
    <p class="burning-text" id="burning-echo"></p>
    <p class="burning-hint">沉默中……</p>
  </section>

  <!-- 屏 5：抽签 -->
  <section class="screen" id="screen-lots">
    <p class="lots-hint" id="lots-hint">抽一支签</p>
    <div class="slips" id="slips">
      <div class="slip"></div>
      <div class="slip"></div>
      <div class="slip"></div>
    </div>
    <div class="verse" id="verse-box">
      <p class="verse-text" id="verse-text"></p>
      <p class="verse-theme" id="verse-theme"></p>
    </div>
  </section>

  <!-- 屏 6：回声（AI 回应位） -->
  <section class="screen" id="screen-echo">
    <p class="echo-label">回声</p>
    <p class="echo-text" id="echo-text"></p>
    <button class="btn" id="btn-continue">继续</button>
  </section>

  <!-- 屏 7：结束 -->
  <section class="screen" id="screen-end">
    <p class="end-text">烛火摇了摇，像是点头。</p>
    <div class="end-actions">
      <button class="btn small" id="btn-again">再说一次</button>
      <button class="btn small ghost" id="btn-leave">离开</button>
    </div>
  </section>

  <!-- 屏 8：安心离开 -->
  <section class="screen" id="screen-farewell">
    <p class="farewell-text">烛火已熄，明天再见。</p>
  </section>

<script src="verses.js"></script>
<script src="script.js"></script>
</body>
</html>
